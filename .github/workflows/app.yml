name: Application CI Pipeline

on:
  workflow_dispatch:

  # push:
  #   branches:
  #     - main

  #   paths:
  #     - "applications/frontend/**"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: devops-repo
  IMAGE_NAME: frontend
  SERVICE_NAME: frontend

jobs:

  build-and-deploy:

    name: Build Scan Push Deploy

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud config set project $PROJECT_ID

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.run_number }} \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest \
            ./applications/frontend

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-repo/frontend:${{ github.run_number }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push Version Tag
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.run_number }}

      - name: Push Latest Tag
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest

      - name: Deploy To Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Show Deployment Details
        run: |
          echo "========================================="
          echo "Deployment Successful"
          echo "Project    : $PROJECT_ID"
          echo "Region     : $REGION"
          echo "Service    : $SERVICE_NAME"
          echo "Repository : $REPOSITORY"
          echo "Image Tag  : ${{ github.run_number }}"
          echo "========================================="

          gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(status.url)'
