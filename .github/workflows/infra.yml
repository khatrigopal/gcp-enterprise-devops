name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:

  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      - name: Terraform Init
        working-directory: infrastructure/environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/environments/${{ github.event.inputs.environment }}
        run: terraform validate

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          framework: terraform
          quiet: true

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure

      - name: Terraform Plan
        working-directory: infrastructure/environments/${{ github.event.inputs.environment }}
        run: |
          terraform plan \
          -var-file=terraform.tfvars \
          -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/environments/${{ github.event.inputs.environment }}/tfplan


  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    environment: ${{ github.event.inputs.environment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/environments/${{ github.event.inputs.environment }}

      - name: Terraform Init
        working-directory: infrastructure/environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/environments/${{ github.event.inputs.environment }}
        run: terraform apply -auto-approve tfplan
